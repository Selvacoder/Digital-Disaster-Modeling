services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: blueprint3d-backend
    ports:
      - "8000:8000"
    volumes:
      - ./Target:/app/Target
      - ./Images/Uploads:/app/Images/Uploads
      - ./Models:/app/Models
      - ./Configs:/app/Configs
    restart: unless-stopped

  frontend:
    build:
      context: ./webapp/frontend
      dockerfile: Dockerfile
    container_name: blueprint3d-frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"
    restart: unless-stopped
